[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "singulab"
version = "0.1.0"
description = "LLM-based multi-agent emergence simulation (Singulab hackathon 2026-04)"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "pydantic",
    "structlog",
    "python-dotenv",
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
