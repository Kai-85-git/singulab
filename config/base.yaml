# 共通デフォルト。各 scenario_*.yaml は `extends: base.yaml` で継承する。
# 上書きしたい項目だけ scenario 側に書く。

random_seed: 42

simulation:
  duration: 5  # 各シナリオで上書き
  half_space_size: 25
  half_place_size: 5

agents:
  num_agents: 10
  communication_radius: 5
  memory_limit: 20
  memory_size: 5
  message_history_limit: 10
  message_context_size: 3
  initial_placement: "random_in_place"
  home_place: "main_office"

# 場(1階)はシナリオ側で必須。base ではダミーを置かない
places: []

environment:
  economy: "neutral"

world_laws:
  communication_radius: 5.0
  communication_radius_overrides: {}
  cognitive_limit: 30
  message_delay:
    same_place_near: 0
    same_place_far: 1
    cross_place: 3

llm:
  # 採用方針(Phase 0.5 検証済み):
  #   - 大集団 100 体: huihui_ai/llama3.2-abliterate:3b(JSON 完璧 + 速い)
  #   - 小〜中集団: huihui_ai/qwen3-abliterated:4b + think: false(自然な日本語)
  # 既定は Qwen3 4B abliterated + thinking 抑制
  model: "huihui_ai/qwen3-abliterated:4b"
  base_url: "http://localhost:11434"
  temperature: 0.5
  max_tokens: 512
  repeat_penalty: 1.1
  repeat_last_n: 128
  min_p: 0.05
  # M-05 検証(2026-04-29)で thinking モデルでは think: false が必須と判明
  # null=モデル既定 / true=思考有効 / false=思考抑制
  think: false

fires: []

# Phase 1.5: 可視化(matplotlib フレーム保存)
# 既定は false。動画化したいシナリオで true に上書きする
visualization:
  save_frames: false  # true で各ステップを PNG 保存
  frame_interval: 1   # N ステップに 1 枚

logging:
  level: "INFO"
