# 共通デフォルト。各 scenario_*.yaml は `extends: base.yaml` で継承する。
# 上書きしたい項目だけ scenario 側に書く。

random_seed: 42

simulation:
  duration: 5  # 各シナリオで上書き
  half_space_size: 25
  half_place_size: 5

agents:
  num_agents: 10
  communication_radius: 5
  memory_limit: 20
  memory_size: 5
  message_history_limit: 10
  message_context_size: 3
  initial_placement: "random_in_place"
  home_place: "main_office"
  # 2026-04-29 議事録改訂版ペルソナ(新スキーマ):
  #   旧: name / role / tenure_years / location_label / company_type_label
  #   新: age / gender / nationality / mbti
  # 各シナリオ yaml で必要なら個別に上書きする。
  # `persona:` セクションを持たないシナリオではペルソナ生成スキップ(参考実装互換)。
  persona:
    age:
      range: [20, 60]
    gender:
      values: ["male", "female"]
    nationality:
      # 4/24 議事録 §62「日本人ベース、10 人中 1 人外国人」設計に回帰(2026-05-01 ユーザ判断)。
      # 外国人 10% = 残り 8 ヵ国に均等配分(各 1.25%)。日本人 90%。
      pool: ["日本", "米国", "中国", "インド", "ブラジル", "ドイツ", "フランス", "韓国", "ベトナム"]
      weights: [90, 1.25, 1.25, 1.25, 1.25, 1.25, 1.25, 1.25, 1.25]
    mbti:
      values: ["INTJ", "INTP", "ENTJ", "ENTP",
               "INFJ", "INFP", "ENFJ", "ENFP",
               "ISTJ", "ISFJ", "ESTJ", "ESFJ",
               "ISTP", "ISFP", "ESTP", "ESFP"]

# 場(1階)はシナリオ側で必須。base ではダミーを置かない
places: []

environment:
  economy: "neutral"

world_laws:
  communication_radius: 5.0
  communication_radius_overrides: {}
  cognitive_limit: 30
  message_delay:
    same_place_near: 0
    same_place_far: 1
    cross_place: 3

llm:
  # 採用方針(Phase 0.5 検証済み):
  #   - 大集団 100 体: huihui_ai/llama3.2-abliterate:3b(JSON 完璧 + 速い)
  #   - 小〜中集団: huihui_ai/qwen3-abliterated:4b + think: false(自然な日本語)
  # 既定は Qwen3 4B abliterated + thinking 抑制
  model: "huihui_ai/qwen3-abliterated:4b"
  base_url: "http://localhost:11434"
  # 2026-04-30 改訂(問題解決ToDo A-1-3 / A-1-4):
  #   max_tokens 512 → 100  : 長文要求で定型句に逃げるのを防ぎ、短い感情表現を引き出す
  #   temperature 0.5 → 0.8 : 多様性を取り戻し、エコー(同じ発言の伝染)を抑制
  #   詳細は docs/03_ToDo/2026-04-30_問題解決ToDo.md §A-1
  temperature: 0.8
  max_tokens: 100
  repeat_penalty: 1.1
  repeat_last_n: 128
  min_p: 0.05
  # M-05 検証(2026-04-29)で thinking モデルでは think: false が必須と判明
  # null=モデル既定 / true=思考有効 / false=思考抑制
  think: false

fires: []

# Phase 1.5: 可視化(matplotlib フレーム保存)
# 既定は false。動画化したいシナリオで true に上書きする
visualization:
  save_frames: false  # true で各ステップを PNG 保存
  frame_interval: 1   # N ステップに 1 枚

logging:
  level: "INFO"
