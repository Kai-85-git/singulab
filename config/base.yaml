# 共通デフォルト。各 scenario_*.yaml は `extends: base.yaml` で継承する。
# 上書きしたい項目だけ scenario 側に書く。

random_seed: 42

simulation:
  duration: 5  # 各シナリオで上書き
  half_space_size: 25
  half_place_size: 5

agents:
  num_agents: 10
  communication_radius: 5
  memory_limit: 20
  memory_size: 5
  message_history_limit: 10
  message_context_size: 3
  initial_placement: "random_in_place"
  home_place: "main_office"

# 場(1階)はシナリオ側で必須。base ではダミーを置かない
places: []

environment:
  economy: "neutral"

world_laws:
  communication_radius: 5.0
  communication_radius_overrides: {}
  cognitive_limit: 30
  message_delay:
    same_place_near: 0
    same_place_far: 1
    cross_place: 3

llm:
  model: "qwen2.5:3b"
  base_url: "http://localhost:11434"
  temperature: 0.5
  max_tokens: 512
  repeat_penalty: 1.1
  repeat_last_n: 128
  min_p: 0.05

fires: []

logging:
  level: "INFO"
