# 地方 × 大企業 × neutral
# 大企業フォーマットだが地方支社の文脈

extends: "base.yaml"

simulation:
  duration: 5

agents:
  num_agents: 10
  initial_placement: "random_in_place"
  home_place: "main_office"
  persona:
    location_label: "地方"
    company_type_label: "大企業"
    name_pool: ["田中", "佐藤", "鈴木", "高橋", "伊藤", "山本", "中村", "小林"]
    role_distribution:
      "エンジニア": 0.3
      "マネージャー": 0.2
      "リーダー": 0.2
      "平社員": 0.3
    tenure_range: [3, 30]  # 地方支社は社歴長め想定

places:
  - name: "main_office"
    type: "office"
    center_x: 0
    center_y: 0
    half_size: 10
    capacity: 50
  - name: "meeting_room"
    type: "meeting"
    center_x: 5
    center_y: 5
    half_size: 2
    capacity: 8

environment:
  economy: "neutral"

world_laws:
  communication_radius: 5.0
  communication_radius_overrides:
    meeting_room: 5.0
  cognitive_limit: 20
