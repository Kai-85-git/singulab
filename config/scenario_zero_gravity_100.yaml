places:
  - name: "main_office"
    type: "office"
    center_x: 0
    center_y: 0
    half_size: 20
    capacity: 120
    description: "100 人規模の大型オフィスフロア。デスクが整然と並び、窓側からは外の景色が見える。給湯コーナーや共有スペースもある。"

# scenario_alien_100.yaml と同じく 15 m に拡張(集団反応観察のため)
world_laws:
  communication_radius: 15.0

events:
  - type: "zero_gravity"
    # 100 step の場合、step 50(中間)でイベント発火。前半は日常会話、後半は反応観察。
    start_step: 50

llm:
  # ⚠️ 粉川氏マシンで `ollama list` を実行し、実際にあるタグに書き換えてください。
  model: "huihui_ai/qwen3-uncensored:34b"
  max_tokens: 150
  think: false
