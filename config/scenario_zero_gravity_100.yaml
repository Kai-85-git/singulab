# 100 人 × 無重力イベント(粉川氏マシン用)。
# Qwen3 34B Uncensored で実走想定。RTX 3060 Laptop 6GB では完走不可。
# 詳細手順: docs/05_運用手順/粉川氏向け_100体ラン手順.md

extends: "scenario_zero_gravity_5.yaml"

simulation:
  duration: 100

agents:
  num_agents: 100

places:
  - name: "main_office"
    type: "office"
    center_x: 0
    center_y: 0
    half_size: 25
    capacity: 200

events:
  - type: "zero_gravity"
    # 100 step の場合、step 50(中間)でイベント発火。前半は日常会話、後半は反応観察。
    start_step: 50

llm:
  # ⚠️ 粉川氏マシンで `ollama list` を実行し、実際にあるタグに書き換えてください。
  model: "huihui_ai/qwen3-uncensored:34b"
  max_tokens: 150
  think: false
