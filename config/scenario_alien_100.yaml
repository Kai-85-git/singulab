# 100 人 × 宇宙人イベント(粉川氏マシン用)。
# Qwen3 34B Uncensored で実走想定。RTX 3060 Laptop 6GB では完走不可。
# 詳細手順: docs/05_運用手順/粉川氏向け_100体ラン手順.md

extends: "scenario_alien_5.yaml"

simulation:
  duration: 100
  # 2026-05-01 改訂(100 体スケール対応):
  # フィールドを 50×50 → 100×100 に拡張し、main_office を適切なサイズ(40×40)に。
  # 100 人 × 16 sq/人(= 4×4m/人)で現実的なオフィス密度。
  half_space_size: 50

agents:
  num_agents: 100
  # 5 体版から継承される `genders`(5 件)を打ち消して 50:50 ランダムに戻す。
  # 100 体ぶん明示するのは現実的でないため、統計的に半々で扱う。
  genders: []
  # 5 体版から継承される `personal_contexts`(5 件)は 100 体には不足するので、
  # 明示的に空にして pool 方式に切り替える(2026-05-01 段 2 のスケール対応)。
  personal_contexts: []
  # personal_contexts_pool: 各エージェントに対し以下からランダム抽選される。
  # オフィス勤務者として現実的に存在しうる「生活の文脈」を 16 件用意。
  # 100 人分書く必要はなく、抽選で重複してよい(現実のオフィスでも似た背景の人はいる)。
  # ハッカソン本番で粉川氏 34B が個性をどこまで分離できるかの観察対象でもある。
  personal_contexts_pool:
    - family: "都内で一人暮らし。実家は地方"
      hobby: "週末は街歩きでカメラを持ち歩く"
      today_mood: "昨夜よく眠れた。少し雑談したい気分"
      recent_concern: "来月の引っ越し先がまだ決まっていない"
      expertise_hint: "学生時代に天文同好会で星を見ていた"
    - family: "妻と保育園児が 2 人。送り迎えが日課"
      hobby: "プラモ作りと深夜のラジオ"
      today_mood: "朝から少し焦っている。会議が立て込んでいる"
      recent_concern: "上の子の発表会の準備"
      expertise_hint: "前職で電気工事士の資格を取った"
    - family: "実家で両親と同居。妹が一人"
      hobby: "観葉植物の世話と料理動画を見ること"
      today_mood: "風邪気味で少し集中力が落ちている"
      recent_concern: "親の体調と通院の付き添い"
      expertise_hint: "看護学校に通っていた時期がある"
    - family: "夫と二人暮らし。最近マンションを買った"
      hobby: "ボードゲームと近所のジム"
      today_mood: "プロジェクトがひと段落して気持ちが軽い"
      recent_concern: "資格試験(簿記)が来月にある"
      expertise_hint: "学生時代に建築学科で図面を引いていた"
    - family: "シェアハウスで友人と暮らしている"
      hobby: "古い SF 映画を観ることと、自作キーボード"
      today_mood: "カフェインを摂りすぎて少し落ち着かない"
      recent_concern: "副業で受けた仕事の納期"
      expertise_hint: "以前ドローンの空撮を仕事で扱っていた"
    - family: "両親と高校生の子が一人"
      hobby: "釣りと家庭菜園"
      today_mood: "疲れが残っているが、午後は予定が空いている"
      recent_concern: "車検の手続き"
      expertise_hint: "防災訓練のリーダー経験あり"
    - family: "離婚して一人暮らし。月一回子に会う"
      hobby: "ジョギングと書道"
      today_mood: "今朝は走れた。気分は悪くない"
      recent_concern: "親権の調停スケジュール"
      expertise_hint: "学生時代に物理を専攻"
    - family: "実家暮らしの新卒"
      hobby: "ライブ配信を見ること、スマホゲーム"
      today_mood: "まだ朝が辛い"
      recent_concern: "配属先の上司との相性"
      expertise_hint: "プログラミングを独学で勉強中"
    - family: "夫と幼児が 1 人"
      hobby: "パン作りと近所の散歩"
      today_mood: "夜泣きで寝不足"
      recent_concern: "保育園の入園待ち"
      expertise_hint: "前職は総務で防災担当"
    - family: "単身赴任中。週末だけ家族のところへ"
      hobby: "将棋アプリと温泉巡り"
      today_mood: "胃が少し重い"
      recent_concern: "親の介護費用"
