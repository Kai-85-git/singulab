places:
  - name: "main_office"
    type: "office"
    center_x: 0
    center_y: 0
    half_size: 20
    capacity: 120
    description: "100 人規模の大型オフィスフロア。デスクが整然と並び、窓側からは外の景色が見える。給湯コーナーや共有スペースもある。"

# 2026-05-01 改訂:現実のオフィス会話距離(社会距離 1.2〜3.5 m + 大声で呼びかけ)に
# 近づけ 8 m に。設計書 [05_3階-物理-重力/03_コミュニケーション到達距離] §3 の
# 「大集団 r_comm 3〜5」よりはやや広めだが、100 体での派閥観察と現実感の両立を狙う。
world_laws:
  communication_radius: 8.0

events:
  - type: "alien"
    # 100 step の場合、step 50(中間)でイベント発火。前半は日常会話、後半は反応観察。
    start_step: 50
    # UFO 着地点を main_office (-20..20) の外側に。窓際のエージェントだけが
    # 段 3(イベント観察距離依存)で Mid 視認、奥側は会話伝播でのみ知る形になる。
    center_x: -35
    center_y: 30

llm:
  # ⚠️ 粉川氏マシンで `ollama list` を実行し、実際にあるタグに書き換えてください。
  # 想定値はあくまでサンプル。huihui_ai 系で 34B Uncensored を pull していれば近い名前のはず。
  model: "huihui_ai/qwen3-uncensored:34b"
  # 34B は応答が長くなりがちなので max_tokens を少し増やしておく(短文化対策の意図は維持)
  max_tokens: 150
  # 思考可視化が見たい場合は think: true(議事録 §2.2 で粉川氏が魅力と評価)
  think: false
