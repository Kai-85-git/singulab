    - family: "学生時代からの恋人と同棲中"
      hobby: "クライミングジムとボルダリング"
      today_mood: "肩こりがひどい"
      recent_concern: "結婚式の費用と日取り"
      expertise_hint: "登山サークルで地図読みが得意"
    - family: "両親と祖母と同居の三世代"
