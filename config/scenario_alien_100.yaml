# 100 人 × 宇宙人イベント(粉川氏マシン用)。
# Qwen3 34B Uncensored で実走想定。RTX 3060 Laptop 6GB では完走不可。
# 詳細手順: docs/05_運用手順/粉川氏向け_100体ラン手順.md

extends: "scenario_alien_5.yaml"

simulation:
  duration: 100

agents:
  num_agents: 100

places:
  - name: "main_office"
    type: "office"
    center_x: 0
    center_y: 0
    half_size: 25
    capacity: 200

llm:
  # ⚠️ 粉川氏マシンで `ollama list` を実行し、実際にあるタグに書き換えてください。
  # 想定値はあくまでサンプル。huihui_ai 系で 34B Uncensored を pull していれば近い名前のはず。
  model: "huihui_ai/qwen3-uncensored:34b"
  # 34B は応答が長くなりがちなので max_tokens を少し増やしておく(短文化対策の意図は維持)
  max_tokens: 150
  # 思考可視化が見たい場合は think: true(議事録 §2.2 で粉川氏が魅力と評価)
  think: false
