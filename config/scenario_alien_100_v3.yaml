# 100 体 × 宇宙人 本番ラン v3(2026-05-02)。
# 私側 PC(RTX 3060 Laptop 6GB)+ Qwen3 4B abliterated で約 9 時間。
# 5 体 alien_5(prod_v3_alien_5)と同条件で「集団サイズだけが効く」ことを観察するための設計:
# - 同じモデル(4B)、同じ通信半径(5.0)、同じイベント設計
# - 男女比は試験条件として 8:2(要件定義 02_エージェント属性 §2)
# - 国籍 9:1(日本 90% / 外国 10%)は base.yaml 継承
# - main_office を 60×60 m に拡大(100 人で 36 m²/人 = 現実感)
# - meeting_room_a/b を 5 体と同サイズで残す(サイズ感確認のため。議事録 §5 とは差分あり)

extends: "scenario_alien_5.yaml"

llm:
  # 5 体検証と同じモデルを使う(検証目的、ユーザ指示)
  model: "huihui_ai/qwen3-abliterated:4b"
  max_tokens: 100
  think: false

simulation:
  duration: 30
  half_space_size: 60  # フィールド 120×120 m(2026-05-02 拡張、視覚的余裕のため)

agents:
  num_agents: 100
  # 5 体版から継承される `genders`(5 件)を打ち消す。weights 抽選を使用。
  genders: []
  # 男女比 8:2(要件定義 02_エージェント属性 §2「試験条件で振る」)
  persona:
    gender:
      values: ["male", "female"]
      weights: [80, 20]
  # 5 体版から継承される `personal_contexts`(5 件)を打ち消し、pool 抽選に切替
  personal_contexts: []
  personal_contexts_pool:
    - family: "都内で一人暮らし。実家は地方"
      hobby: "週末は街歩きでカメラを持ち歩く"
