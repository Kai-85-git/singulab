# 5 人 × 宇宙人イベント(2026-04-29 議事録 §3.2 採用シナリオ)。
# 部署分けなし(main_office のみ、議事録 §5)。
# Qwen3 4B abliterated + think:false + max_tokens=100 + temperature=0.8(M-08/M-09 適用済)。
# MBTI ペルソナ(議事録改訂版)を base.yaml から継承。

extends: "base.yaml"

simulation:
  # 30 step に変更(前半14step=日常、step 15 でイベント発火、後半は反応観察)。
  # 日常 vs 突発イベントのコントラストを観察するため(ユーザフィードバック 2026-04-30)。
  duration: 30

agents:
  num_agents: 5
  initial_placement: "random_in_place"
  home_place: "main_office"
  # 2026-05-01 改訂(問題解決ToDo §3 段 2):
  # 旧 conversation_profiles(role / speaking_style 直書き)はエコーループの一因
  # かつ「役割を演じさせる」設計だったため撤去。代わりに personal_contexts で
  # 各エージェント固有の生活の文脈(家族・趣味・気分・気にしていること・詳しい分野)を付与。
  # これによりインプット自体が多様化し、同じイベントへの反応が自然に分岐する。
  personal_contexts:
    - family: "都内で一人暮らし。実家は地方"
      hobby: "週末は街歩きでカメラを持ち歩く"
      today_mood: "昨夜よく眠れた。少し雑談したい気分"
      recent_concern: "来月の引っ越し先がまだ決まっていない"
      expertise_hint: "学生時代に天文同好会で星を見ていた"
    - family: "妻と保育園児が 2 人。送り迎えが日課"
      hobby: "プラモ作りと深夜のラジオ"
      today_mood: "朝から少し焦っている。会議が立て込んでいる"
      recent_concern: "上の子の発表会の準備"
      expertise_hint: "前職で電気工事士の資格を取った"
    - family: "実家で両親と同居。妹が一人"
      hobby: "観葉植物の世話と料理動画を見ること"
      today_mood: "風邪気味で少し集中力が落ちている"
      recent_concern: "親の体調と通院の付き添い"
      expertise_hint: "看護学校に通っていた時期がある"
    - family: "夫と二人暮らし。最近マンションを買った"
      hobby: "ボードゲームと近所のジム"
      today_mood: "プロジェクトがひと段落して気持ちが軽い"
      recent_concern: "資格試験(簿記)が来月にある"
      expertise_hint: "学生時代に建築学科で図面を引いていた"
    - family: "シェアハウスで友人と暮らしている"
      hobby: "古い SF 映画を観ることと、自作キーボード"
      today_mood: "カフェインを摂りすぎて少し落ち着かない"
      recent_concern: "副業で受けた仕事の納期"
      expertise_hint: "以前ドローンの空撮を仕事で扱っていた"

places:
  - name: "main_office"
    type: "office"
    center_x: 0
    center_y: 0
    half_size: 10
    capacity: 100
    description: "オープンなオフィスフロア。中央に共有デスクが並び、各席にノートパソコンが置かれている。壁際にはホワイトボードと観葉植物、給湯コーナー。"
  # 入れ子 place(office の内側に重ねて配置)。half_size が小さいので所在判定で内側優先。
  - name: "meeting_room_a"
    type: "meeting_room"
    center_x: -6
    center_y: 6
    half_size: 2
    capacity: 4
    description: "小会議室 A。長机と 4 脚の椅子、壁掛けのモニタが 1 台。資料投影や少人数の打ち合わせに使う。"
  - name: "meeting_room_b"
    type: "meeting_room"
    center_x: 6
    center_y: -6
    half_size: 2
    capacity: 4
    description: "小会議室 B。ホワイトボードと丸テーブル、椅子 4 脚。雑談ベースの打ち合わせや 1on1 によく使われる。"

environment:
  economy: "neutral"

world_laws:
  communication_radius: 10.0
  cognitive_limit: 10

events:
  - type: "alien"
    # step 15 で発火 = 前半は普通の業務会話、後半でイベントへの反応を観察する
    start_step: 15
    # 着地点(half_space_size=25 のフィールドで、main_office の外側に降下)
    # 視覚的に「ここに UFO が来た」と分かるよう、main_office から離れた場所
    center_x: -15
    center_y: 12
    # active 中、毎 step ±2 の範囲でランダム移動(2026-05-01 ユーザフィードバック)
    move_step_size: 2
    # prompt_text 省略時はデフォルト「現在、地球外生命体との接触が確認されています。」+ 座標

visualization:
  save_frames: true
  frame_interval: 1
